server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Docker DNS avoids retaining a stale API address after API recreation.
    resolver 127.0.0.11 valid=10s;
    # Only the validated status resource accepts writes through the dashboard.
    location ~ ^/api-proxy/api/v1/inquiries/[0-9a-fA-F-]+/status$ {
        limit_except PATCH { deny all; }
        client_max_body_size 1k;
        set $api_upstream api:8000;
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
    location /api-proxy/ {
        limit_except GET { deny all; }
        set $api_upstream api:8000;
        rewrite ^/api-proxy/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
